<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1d2f5c">
<title>Pizza &amp; Pop – Ready to collect</title>
<style>
:root{--navy:#1d2f5c;--red:#a51f24;--cream:#fbf5e6;--green:#2e8b3e;--gold:#f2b740}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,ui-rounded,"Segoe UI",system-ui,sans-serif;background:var(--navy);color:#fff;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 24px;background:var(--red);border-bottom:6px solid #fff}
header h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:clamp(1.6rem,4vw,3rem)}
.clock{font-weight:900;font-size:clamp(1.2rem,3vw,2.2rem);font-variant-numeric:tabular-nums}
main{flex:1;display:grid;grid-template-columns:2fr 1fr;gap:18px;padding:18px;min-height:0}
section{background:rgba(255,255,255,.06);border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;min-height:0}
h2{margin:0 0 12px;font-size:clamp(1.3rem,3vw,2.4rem);display:flex;align-items:center;gap:12px}
.count{background:#fff;color:var(--navy);border-radius:999px;padding:2px 14px;font-size:.7em}
.ready h2{color:#b9f5c4}
.list{display:grid;gap:12px;overflow:hidden;align-content:start}
.ready .list{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card{border-radius:18px;padding:14px 18px;display:flex;align-items:center;gap:16px}
.ready .card{background:var(--green);border:4px solid #b9f5c4;animation:pop .6s ease-out}
.preparing .card{background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3)}
.num{font-size:clamp(2rem,5vw,4rem);font-weight:1000;line-height:1;font-variant-numeric:tabular-nums}
.preparing .num{font-size:clamp(1.4rem,3vw,2.4rem)}
.who strong{display:block;font-size:clamp(1.3rem,3vw,2.4rem);line-height:1.1}
.who small{display:block;font-size:clamp(.9rem,1.6vw,1.2rem);opacity:.9}
.preparing .who strong{font-size:clamp(1.1rem,2.2vw,1.7rem)}
.tag{display:inline-block;background:var(--gold);color:#3a2a00;border-radius:999px;padding:1px 8px;font-size:.8rem;font-weight:900;margin-left:6px}
.empty{opacity:.75;font-size:clamp(1.1rem,2.4vw,1.8rem);margin-top:8px}
footer{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 24px;font-size:1rem;opacity:.9}
button{font:inherit;font-weight:800;border-radius:999px;border:2px solid #fff;background:transparent;color:#fff;padding:8px 16px;cursor:pointer}
button.on{background:#fff;color:var(--navy)}
.offline{color:#ffd0d0;font-weight:800}
.flash{animation:flash 1.2s ease-in-out 3}
@keyframes pop{from{transform:scale(.85);opacity:.3}to{transform:none;opacity:1}}
@keyframes flash{50%{background:var(--green)}}
@media(max-width:800px){main{grid-template-columns:1fr}.ready .list{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>🍕 Pizza &amp; Pop – Ready to collect</h1><div class="clock" id="clock">--:--</div></header>
<main>
  <section class="ready"><h2>✅ Ready <span class="count" id="readyCount">0</span></h2><div class="list" id="readyList"></div></section>
  <section class="preparing"><h2>🔥 In the oven <span class="count" id="prepCount">0</span></h2><div class="list" id="prepList"></div></section>
</main>
<footer><span id="status">Connecting…</span><button id="sound" type="button">🔇 Tap to turn on sound</button></footer>
<script>
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
let seen=null,audio=null,soundOn=false;
$('#sound').onclick=()=>{try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume();soundOn=!soundOn;$('#sound').classList.toggle('on',soundOn);$('#sound').textContent=soundOn?'🔔 Sound on':'🔇 Tap to turn on sound';if(soundOn)chime();}catch{}};
function chime(){if(!soundOn||!audio)return;const t=audio.currentTime;[659,880,1175].forEach((f,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.setValueAtTime(.0001,t+i*.18);g.gain.exponentialRampToValueAtTime(.35,t+i*.18+.02);g.gain.exponentialRampToValueAtTime(.0001,t+i*.18+.5);o.connect(g).connect(audio.destination);o.start(t+i*.18);o.stop(t+i*.18+.55);});}
const card=o=>`<div class="card"><div class="num">#${esc(o.orderNumber)}</div><div class="who"><strong>${esc(o.name)}${o.audit?'<span class="tag">AUDIT</span>':''}</strong><small>${esc(o.pizzaName)}</small></div></div>`;
async function load(){
  try{
    const r=await fetch('/api/board',{cache:'no-store'});if(!r.ok)throw 0;const d=await r.json();
    const ready=[...d.ready].reverse();   // newest first
    $('#readyList').innerHTML=ready.length?ready.map(card).join(''):'<p class="empty">Nothing waiting – pizzas appear here as soon as they are ready.</p>';
    $('#prepList').innerHTML=d.preparing.length?d.preparing.map(card).join(''):'<p class="empty">Nothing in the oven right now.</p>';
    $('#readyCount').textContent=d.ready.length;$('#prepCount').textContent=d.preparing.length;
    const ids=new Set(d.ready.map(o=>o.orderNumber));
    if(seen&&[...ids].some(n=>!seen.has(n))){chime();$('.ready').classList.remove('flash');void $('.ready').offsetWidth;$('.ready').classList.add('flash');}
    seen=ids;
    $('#status').textContent=d.eventFinished?'🏁 Pizza day finished – thank you, ED team!':'Live · updates every 5 seconds';$('#status').classList.remove('offline');
  }catch{$('#status').textContent='Reconnecting…';$('#status').classList.add('offline');}
}
function tick(){$('#clock').textContent=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});}
tick();setInterval(tick,10000);load();setInterval(load,5000);
// Keep the screen awake where supported.
if('wakeLock' in navigator){const lock=()=>navigator.wakeLock.request('screen').catch(()=>{});lock();document.addEventListener('visibilitychange',()=>{if(!document.hidden)lock();});}
</script>
</body>
</html>
