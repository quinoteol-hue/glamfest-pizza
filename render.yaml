services:
  - type: web
    name: glamfest-pizza-orders
    repo: https://github.com/quinoteol-hue/glamquiz
    branch: main
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: GLAMQUIZ_DATA_FILE
        value: /var/data/quizzes.json
    disk:
      name: glamfest-pizza-data
      mountPath: /var/data
      sizeGB: 1
